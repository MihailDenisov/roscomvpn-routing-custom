#         proxy_set_header X-Forwarded-Proto https;
#
#         # proxy_pass without a URI keeps the original path + query string.
#         proxy_pass http://127.0.0.1:4600;
#
#         # Long-poll carrier may intentionally hold a request open.
#         proxy_read_timeout 180s;
