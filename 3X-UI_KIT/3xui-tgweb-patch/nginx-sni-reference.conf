#
# tgwebproxy-multi side:
#   behind_proxy = true
#   listen       = "127.0.0.1:4600"
#   domain       = "web.maicraft.tech"
#   admin.listen = "127.0.0.1:9601"
#
# Pre-deployment checks:
#   1) nginx -t
#   2) confirm :9443 is loopback-only
#   3) confirm :4600 and :9601 are loopback-only
#   4) curl/openssl test with SNI web.maicraft.tech
#   5) run tgwebproxy-probe against public web.maicraft.tech
