name: 3X-UI KIT Python checks

on:
  push:
    paths:
      - "3X-UI_KIT/kit-sub.py"
      - "3X-UI_KIT/sub-theme/**"
      - "3X-UI_KIT/tests/**"
      - ".github/workflows/3x-ui-kit-python.yml"
  pull_request:
    paths:
      - "3X-UI_KIT/kit-sub.py"
      - "3X-UI_KIT/sub-theme/**"
      - "3X-UI_KIT/tests/**"
      - ".github/workflows/3x-ui-kit-python.yml"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependency
        run: python -m pip install PyYAML
      - name: Python syntax
        run: python -m py_compile 3X-UI_KIT/kit-sub.py
      - name: TgWeb subscription UI regression tests
        run: python -m unittest -v 3X-UI_KIT/tests/test_kit_sub_tgweb_ui.py
