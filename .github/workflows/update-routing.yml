name: Update custom routing

on:
  push:
    paths:
      - "custom-direct.json"
      - "custom-proxy.json"
      - "scripts/build.py"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build routing
        run: python3 scripts/build.py

      - name: Commit changes
        run: |
          if git diff --quiet -- HAPP/DEFAULT-CUSTOM.JSON HAPP/DEFAULT-CUSTOM.DEEPLINK; then
            echo "No routing changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HAPP/DEFAULT-CUSTOM.JSON HAPP/DEFAULT-CUSTOM.DEEPLINK
          git commit -m "Update custom routing"
          git push
